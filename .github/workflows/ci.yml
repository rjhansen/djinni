name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]
        faster: [false, true]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install a C++23-capable GCC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install Meson and Ninja
        run: pip install --upgrade meson ninja

      - name: Configure
        run: meson setup builddir --buildtype=release -Dfaster=${{ matrix.faster }}

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir -v

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testlog-${{ matrix.os }}-faster-${{ matrix.faster }}
          path: builddir/meson-logs/testlog.txt
